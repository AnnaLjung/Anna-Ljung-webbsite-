tElementById('email').target='_top';document.getElementById('note').textContent=en?'Your email app opens. Send the message there to complete your enquiry. Nothing is registered automatically here, and no place is reserved.':'Ditt mejlprogram öppnas. Skicka mejlet där för att slutföra förfrågan. Inget registreras automatiskt här och ingen plats reserveras.';const close=()=>{if(parent!==window)window.top.postMessage({type:'anna-signup-close',nonce:q.get('nonce')||''},'*');else location.href='../index.html?lang='+lang+'#courses';};document.getElementById('close').hidden=q.get('embedded')==='1';document.getElementById('close').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
