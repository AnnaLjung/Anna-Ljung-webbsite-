<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kursanmälan · Anna Ljung Studio</title><style>
@font-face{font-family:Quicksand;src:url('../Quicksand_Book.otf')}*{box-sizing:border-box}body{margin:0;background:#f2eadf;color:#1f3a45;font:17px/1.7 Quicksand,sans-serif}main{max-width:760px;margin:auto;padding:30px 24px}a{color:inherit;text-underline-offset:5px}h1{font-size:clamp(30px,6vw,44px);font-weight:400;line-height:1.2}iframe{display:block;width:100%;min-height:980px;border:0;background:#f2eadf}header{display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}.action{display:inline-block;background:#f8f3eb;padding:12px 18px;text-decoration:none}.action:hover{background:white}[hidden]{display:none!important}small{font-size:13px}
</style></head><body><main><header><a id="back" href="../index.html#courses">Anna Ljung Studio</a><a id="all" href="index.html">Alla kursdatum</a></header><section id="fallback"><h1 id="courseTitle">Kursanmälan</h1><p id="notice">Välj ett kurstillfälle för att förboka.</p><a class="action" id="interest" href="../signup/index.html">Anmäl intresse för kommande datum</a></section><iframe id="bookingFrame" title="Kursanmälan" hidden></iframe></main><script src="../studio-config.js"></script><script>
const q=new URLSearchParams(location.search),en=q.get('lang')==='en',lang=en?'en':'sv';document.documentElement.lang=lang;
const catalog={young:'Måleri för barn och unga',adult:'Måleri för vuxna',acrylic:'Måla & Skåla',botanical:'Botanical Watercolour',collage:'Cut & Craft','christmas-cards':'Kalligrafi & Julkort','holiday-studio':'Jullovsverkstad',archipelago:'Skärgårdsakvarell'};
const selected=q.get('workshop')||q.get('course');const key=Object.hasOwn(catalog,selected)?selected:'';document.getElementById('courseTitle').textContent=key?catalog[key]:(en?'Course registration':'Kursanmälan');document.title=document.getElementById('courseTitle').textContent+' · Anna Ljung Studio';
document.getElementById('back').href='../index.html?lang='+lang+'#courses';document.getElementById('all').href='index.html?lang='+lang;document.getElementById('all').textContent=en?'All course dates':'Alla kursdatum';
const interest=document.getElementById('interest');interest.href='../signup/index.html?'+new URLSearchParams({topic:key||'newsletter',lang});interest.textContent=en?'Register interest in future dates':'Anmäl intresse för kommande datum';
if(window.studioTemporaryEmailEnabled && key && !['young','adult'].includes(key)){interest.href='mailto:hello@annaljung.se?subject='+encodeURIComponent((en?'Course enquiry – ':'Kursförfrågan – ')+catalog[key]);interest.textContent=en?'Ask Anna about dates by email':'Mejla Anna om datum';document.getElementById('notice').textContent=en?'Anna handles workshop dates and places personally by email.':'Anna hjälper dig personligen med workshopdatum och platser via mejl.';}else if(window.studioBookingEnabled && window.studioBookingUrl && key!=='archipelago' && (!key || ['young','adult'].includes(key) || window.studioWorkshopBookingEnabled)) {const url=new URL(window.studioBookingUrl);url.searchParams.set('view','booking');url.searchParams.set('lang',lang);if(key)url.searchParams.set('course',key);if(window.studioEmbeddedBookingEnabled){const frame=document.getElementById('bookingFrame');frame.src=url.href;frame.hidden=false;document.getElementById('fallback').hidden=true;}else{interest.href=url.href;interest.textContent=en?'Choose a date and pre-register':'Välj datum och förboka';document.getElementById('notice').textContent=en?'Registration opens in Anna’s booking system.':'Anmälan öppnas i Annas bokningssystem.';}}else{document.getElementById('notice').textContent=en?'Dates will be listed here when booking opens. Register your interest and Anna will let you know.':'Här visas datum när bokningen öppnar. Anmäl ditt intresse så hör Anna av sig.';}
</script></body></html>
